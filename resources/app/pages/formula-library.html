<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formula Library - Math Genius</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/cards.css">
<link rel="stylesheet" href="../css/formula.css">

</head>

<body>

<div class="page-header">

<button type="button" class="back-btn" id="formulaBackBtn">
← Back
</button>

</div>

<div class="container formula-library-page">

<h1>📚 Formula Library</h1>

<p class="page-desc">
CBSE &amp; ICSE Mathematics — Board → Class → Subject → Chapter → Formula.
</p>

<nav id="formulaBreadcrumb" class="formula-breadcrumb" aria-label="Formula Library path">
</nav>

<div id="syllabusMeta" class="syllabus-meta" hidden aria-label="Syllabus metadata"></div>

<section class="search-section filter-section" id="searchSection">

<div class="filter-grid" role="search" aria-label="Formula filters">

<select id="filterBoard" aria-label="Filter by board">
<option value="">Board</option>
</select>

<select id="filterClass" aria-label="Filter by class">
<option value="">Class</option>
</select>

<select id="filterSubject" aria-label="Filter by subject">
<option value="">Subject</option>
</select>

<select id="filterChapter" aria-label="Filter by chapter">
<option value="">Chapter</option>
</select>

<select id="filterDifficulty" aria-label="Filter by difficulty">
<option value="">Difficulty</option>
</select>

<input
type="text"
id="searchInput"
placeholder="Keyword..."
autocomplete="off"
aria-label="Filter by keyword"
>

</div>

<div class="filter-actions">

<button type="button" id="applyFiltersBtn">
Apply Filters
</button>

<button type="button" id="clearFiltersBtn" class="btn-secondary">
Clear
</button>

<button type="button" id="resetNavBtn" class="btn-secondary">
All Boards
</button>

</div>

</section>

<section class="topic-section" id="navSection">

<h2 id="navSectionTitle">Select Board</h2>

<div id="navGrid" class="nav-grid"></div>

<p id="emptyState" class="empty-state" hidden></p>

</section>

<section class="topic-section" id="formulaSection" hidden>

<h2>
📖 Formulas
(<span id="formulaCount">0</span>)
</h2>

<div
id="formulaList"
class="formula-grid">
</div>

</section>

<section class="topic-section" id="formulaDetailSection" hidden>

<h2>📘 Formula Details</h2>

<div id="formulaDetailActions" class="formula-detail-actions" aria-label="Formula actions">
</div>

<article id="formulaDetailContent" class="formula-detail">
</article>

</section>

</div>

<footer class="formula-footer">

© 2026 Math Genius

</footer>

<script src="../js/formula.js"></script>

</body>

</html>
